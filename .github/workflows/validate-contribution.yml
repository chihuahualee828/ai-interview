name: Validate contribution
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: contribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: https://chihuahualee828.github.io
          BASE_PATH: /ai-interview
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/personal-unavailable.spec.ts
      - run: npm run test:e2e:personal
      - name: Build static personal-sync test fixture
        run: npm run build
        env:
          SITE_URL: https://chihuahualee828.github.io
          BASE_PATH: /ai-interview
          PUBLIC_SUPABASE_URL: https://example.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
      - name: Test personal sync from static project subpath
        run: npm run test:e2e:personal
        env:
          BASE_PATH: /ai-interview
          TEST_PREVIEW: '1'
